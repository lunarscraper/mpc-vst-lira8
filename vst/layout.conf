[tab SENSOR]
frame x=36 y=88 w=1207 h=624 title=""
toggle cx=190 cy=250 label="SENSOR 1" key=sens1
toggle cx=490 cy=250 label="SENSOR 2" key=sens2
toggle cx=790 cy=250 label="SENSOR 3" key=sens3
toggle cx=1090 cy=250 label="SENSOR 4" key=sens4
toggle cx=190 cy=530 label="SENSOR 5" key=sens5
toggle cx=490 cy=530 label="SENSOR 6" key=sens6
toggle cx=790 cy=530 label="SENSOR 7" key=sens7
toggle cx=1090 cy=530 label="SENSOR 8" key=sens8
