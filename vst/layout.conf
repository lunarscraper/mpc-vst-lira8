[tab LFO]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="LFO FREQ A" key=lfoa
knob cx=490 cy=250 r=48 label="LFO FREQ B" key=lfob
popup cx=790 cy=250 w=220 h=48 label="AND / OR" key=andor
toggle cx=1090 cy=250 label="LINK" key=link
knob cx=190 cy=530 r=48 label="DRIVE" key=drive
knob cx=490 cy=530 r=48 label="DIST MIX" key=distmix
knob cx=790 cy=530 r=48 label="VOLUME" key=volume
