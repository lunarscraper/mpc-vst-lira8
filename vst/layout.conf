# LIRA 8 MPC skin layout: 4 x 2 controls per tab at fixed positions, in the order of the
# Force's eight knobs (qlinks). Grid, r=48 and the PRESET tab are those of Rattler / carp 2000.
# TUNE: the eight voices. 1234 / 5678: per pair SHARP, MOD, its SOURCE and FAST. MAIN: pitch and
# hold of both groups and the four switches. LFO: the hyper LFO, with distortion and volume.
# DELAY: both lines and their modulation. SENSOR: the eight sensors as latches (the pads play
# them as notes). PRESET: the knob only browses the 32 slots, LOAD and SAVE act.
# Palette: black panel, white print, orange accents.
style=td3
theme_bg=161616
theme_panel=262626
theme_line=0c0c0c
theme_ink=f4f4f0
theme_ink_dim=b8b8b0
theme_ink_faint=666660
theme_accent=ff7a1a
theme_accent_hi=ffab66
theme_knob_face=0c0c0c
theme_knob_ring=000000
theme_bar=ff7a1a
theme_seg_active=ff7a1a
theme_seg_inactive=0c0c0c
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=0a0a0a
theme_knob_off=555550
theme_tab_on=ff7a1a
theme_tab_on_tx=111111
theme_lcd=1a1208
theme_box=1c1c1c
theme_btn_bg=f4f4f0
theme_chrome_ink=f4f4f0
theme_go_on=ff7a1a
theme_go_off=ffab66
theme_tabs=ff7a1a

[tab TUNE]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="TUNE 1" key=tune1
knob cx=490 cy=250 r=48 label="TUNE 2" key=tune2
knob cx=790 cy=250 r=48 label="TUNE 3" key=tune3
knob cx=1090 cy=250 r=48 label="TUNE 4" key=tune4
knob cx=190 cy=530 r=48 label="TUNE 5" key=tune5
knob cx=490 cy=530 r=48 label="TUNE 6" key=tune6
knob cx=790 cy=530 r=48 label="TUNE 7" key=tune7
knob cx=1090 cy=530 r=48 label="TUNE 8" key=tune8
qlinks "TUNE" = tune1,tune2,tune3,tune4,tune5,tune6,tune7,tune8

[tab 1234]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="SHARP 12" key=sharp12
knob cx=490 cy=250 r=48 label="MOD 12" key=mod12
popup cx=790 cy=250 w=220 h=48 label="SOURCE 12" key=src12
toggle cx=1090 cy=250 label="FAST 12" key=fast12
knob cx=190 cy=530 r=48 label="SHARP 34" key=sharp34
knob cx=490 cy=530 r=48 label="MOD 34" key=mod34
popup cx=790 cy=530 w=220 h=48 label="SOURCE 34" key=src34
toggle cx=1090 cy=530 label="FAST 34" key=fast34
qlinks "1234" = sharp12,mod12,src12,fast12,sharp34,mod34,src34,fast34

[tab 5678]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="SHARP 56" key=sharp56
knob cx=490 cy=250 r=48 label="MOD 56" key=mod56
popup cx=790 cy=250 w=220 h=48 label="SOURCE 56" key=src56
toggle cx=1090 cy=250 label="FAST 56" key=fast56
knob cx=190 cy=530 r=48 label="SHARP 78" key=sharp78
knob cx=490 cy=530 r=48 label="MOD 78" key=mod78
popup cx=790 cy=530 w=220 h=48 label="SOURCE 78" key=src78
toggle cx=1090 cy=530 label="FAST 78" key=fast78
qlinks "5678" = sharp56,mod56,src56,fast56,sharp78,mod78,src78,fast78

[tab MAIN]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="PITCH 1234" key=pitch1234
knob cx=490 cy=250 r=48 label="HOLD 1234" key=hold1234
knob cx=790 cy=250 r=48 label="PITCH 5678" key=pitch5678
knob cx=1090 cy=250 r=48 label="HOLD 5678" key=hold5678
toggle cx=190 cy=530 label="SWITCH" key=switch
toggle cx=490 cy=530 label="TOTAL FB" key=totalfb
toggle cx=790 cy=530 label="VIBRATO" key=vibrato
toggle cx=1090 cy=530 label="QUANTIZE" key=quantize
