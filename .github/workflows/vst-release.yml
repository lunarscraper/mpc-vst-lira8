name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: 0.1.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  lira8:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: lira8-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: lira8
      license: BSD-3-Clause
      about: Drone synthesizer after the SOMA Lyra-8 - a native rebuild of Mike Moreno's Pure Data patch LIRA-8 - 8 voices in 4 pairs with cross FM, hyper LFO, dual modulated delay and distortion; 32 preset slots with LOAD/SAVE.
      dry_run: ${{ inputs.dry_run }}
